name: SLIATE News Bot

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sliate-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python sliatenews.py

      - name: Save seen news
        run: |
          if [ -f sliate_seen_news.json ]; then
            git config user.name "sliate-news-bot"
            git config user.email "sliate-news-bot@users.noreply.github.com"

            git add sliate_seen_news.json

            if ! git diff --cached --quiet; then
              git commit -m "Update SLIATE news state"
              git push
            fi
          fi
